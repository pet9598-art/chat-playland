<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>채팅 놀이터</title>
<style>
  :root{
    --bg:#fff7e8; --card:#ffffff; --ink:#33291f; --sub:#8a7a63;
    --accent:#ff8a3d; --accent2:#3dc3ff; --accent3:#6bd67a; --accent4:#c88bff;
    --danger:#ff5d5d; --line:#f0e2c8; --shadow:0 4px 14px rgba(120,90,40,.12);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .view{display:none;flex:1;flex-direction:column;padding:16px;}
  .view.active{display:flex;}
  h1,h2,h3{margin:0 0 8px;}
  h1{font-size:26px;}
  .sub{color:var(--sub);font-size:13px;margin-bottom:16px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  label{font-size:13px;color:var(--sub);display:block;margin-bottom:6px;font-weight:600;}
  input[type=text]{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fffdf8;color:var(--ink);}
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  button{cursor:pointer;font-family:inherit;}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 3px 0 #d96f28;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d96f28;}
  .btn.secondary{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  .btn.danger{background:var(--danger);box-shadow:0 3px 0 #c73f3f;}
  .btn.small{padding:8px 12px;font-size:13px;box-shadow:none;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .row{display:flex;gap:8px;}
  .grow{flex:1;}
  /* login */
  #avatarWrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  #avatarCanvas{border-radius:50%;border:3px solid var(--line);background:#fff;touch-action:none;}
  .palette{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .swatch.active{box-shadow:0 0 0 2px var(--ink);}
  /* lobby */
  .roomlist{display:flex;flex-direction:column;gap:10px;}
  .roomcard{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;cursor:pointer;}
  .roomcard .tag{font-size:11px;padding:3px 8px;border-radius:20px;color:#fff;font-weight:700;white-space:nowrap;}
  .roomcard .meta{flex:1;min-width:0;}
  .roomcard .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roomcard .count{font-size:12px;color:var(--sub);}
  .empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;}
  .fab-row{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(180deg,rgba(255,247,232,0),var(--bg) 30%);}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(40,30,10,.4);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;}
  .gametype-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
  .gt-card{border:2px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;background:#fffdf8;}
  .gt-card.sel{border-color:var(--accent);background:#fff3e6;}
  .gt-card .emoji{font-size:24px;}
  .gt-card .lbl{font-size:13px;font-weight:700;margin-top:4px;}
  /* room */
  #view-room{padding:0;}
  .roombar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);box-shadow:var(--shadow);position:sticky;top:0;z-index:5;}
  .roombar .title{flex:1;min-width:0;}
  .roombar .rname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roombar .rtype{font-size:11px;color:var(--sub);}
  .statebar{padding:10px 14px;background:#fff3e0;border-bottom:1px solid var(--line);font-size:13px;}
  .roster{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fffefb;border-bottom:1px solid var(--line);}
  .avatar{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);flex-shrink:0;object-fit:cover;}
  .pchip{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;width:48px;}
  .pchip.dead{opacity:.35;}
  .pchip .nm{font-size:10px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pchip.turn .avatar{border-color:var(--accent);box-shadow:0 0 0 2px #ffdcb8;}
  #messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
  .msg{display:flex;gap:8px;max-width:85%;}
  .msg .avatar{width:28px;height:28px;}
  .msg .bubble{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-size:14px;}
  .msg .nm{font-size:11px;color:var(--sub);margin-bottom:2px;font-weight:700;}
  .msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .msg.me .bubble{background:#ffe3c2;}
  .msg.sys{align-self:center;max-width:95%;}
  .msg.sys .bubble{background:#eef2ff;color:#5a5a7a;font-size:12px;box-shadow:none;}
  .msg.bad .bubble{background:#ffd7d7;}
  .inputbar{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line);}
  .inputbar input{flex:1;}
  #view-room{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);flex-direction:column;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#33291f;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
  .voteBtn{padding:4px 8px;font-size:11px;border-radius:8px;}
  .badge{display:inline-block;font-size:10px;background:var(--accent);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;}
  .link{color:var(--accent2);cursor:pointer;text-decoration:underline;font-size:13px;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== LOGIN VIEW ===== -->
  <div id="view-login" class="view active">
    <h1>💬 채팅 놀이터</h1>
    <p class="sub">교실용 실시간 채팅 게임 &mdash; 채팅 · 투표 · 끝말잇기 · 금지어 게임 · 단어 마피아</p>
    <div class="card">
      <label>닉네임 (최대 4자)</label>
      <input type="text" id="nicknameInput" maxlength="4" placeholder="예) 콩벌레">
    </div>
    <div class="card" id="avatarWrap">
      <label style="align-self:flex-start;">나만의 배경 그리기</label>
      <canvas id="avatarCanvas" width="140" height="140"></canvas>
      <div class="palette" id="palette"></div>
      <div class="row">
        <button class="btn secondary small" id="brushSmall">가는 붓</button>
        <button class="btn secondary small" id="brushBig">굵은 붓</button>
        <button class="btn secondary small" id="clearCanvas">지우기</button>
      </div>
    </div>
    <button class="btn" id="enterBtn" style="align-self:stretch;">놀이터 입장하기</button>
    <p class="sub" id="loginStatus" style="text-align:center;margin-top:10px;"></p>
  </div>

  <!-- ===== LOBBY VIEW ===== -->
  <div id="view-lobby" class="view">
    <div class="row" style="align-items:center;">
      <h2 class="grow">🏠 방 목록</h2>
      <span class="link" id="myNameTag"></span>
    </div>
    <p class="sub">참여할 방을 고르거나 새 방을 열어보세요.</p>
    <div class="roomlist" id="roomList"></div>
    <div class="empty hidden" id="roomEmpty">아직 열린 방이 없어요. 첫 방을 만들어보세요!</div>
    <div class="fab-row">
      <button class="btn" id="openCreateModal" style="width:100%;">➕ 방 만들기</button>
    </div>
  </div>

  <!-- ===== ROOM VIEW ===== -->
  <div id="view-room" class="view">
    <div class="roombar">
      <button class="btn secondary small" id="leaveBtn">←</button>
      <div class="title">
        <div class="rname" id="roomNameLbl"></div>
        <div class="rtype" id="roomTypeLbl"></div>
      </div>
      <button class="btn small" id="hostActionBtn" style="display:none;"></button>
    </div>
    <div class="statebar" id="stateBar"></div>
    <div class="roster" id="roster"></div>
    <div id="messages"></div>
    <div class="inputbar">
      <input type="text" id="chatInput" placeholder="메시지를 입력하세요" maxlength="80">
      <button class="btn small" id="sendBtn">전송</button>
    </div>
  </div>

</div>

<!-- ===== CREATE ROOM MODAL ===== -->
<div class="modal-bg" id="createModalBg">
  <div class="modal">
    <h3>새 방 만들기</h3>
    <label>방 이름</label>
    <input type="text" id="roomNameInput" maxlength="16" placeholder="예) 5학년 3반 놀이방">
    <label style="margin-top:12px;">게임 종류</label>
    <div class="gametype-grid" id="gameTypeGrid"></div>
    <label>최대 인원</label>
    <input type="text" id="maxPlayersInput" value="8" inputmode="numeric">
    <div class="row" style="margin-top:14px;">
      <button class="btn secondary grow" id="cancelCreate">취소</button>
      <button class="btn grow" id="confirmCreate">방 만들기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script src="game-wordchain.js"></script>
<script src="game-forbidden.js"></script>
<script src="game-mafia.js"></script>
<script src="app.js"></script>
</body>
</html>
